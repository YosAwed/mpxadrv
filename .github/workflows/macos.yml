name: macOS CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install dependencies
        run: brew install cmake mdxmini fluid-synth

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Download SC-55 SoundFont for render smoke test
        run: |
          mkdir -p SoundFonts
          curl -L \
            https://raw.githubusercontent.com/scummvm/scummvm/24813e60febcab5da73f870f035b7675e88b1d39/dists/soundfonts/Roland_SC-55.sf2 \
            -o SoundFonts/Roland_SC-55.sf2
          echo "fca3e514b635a21789d4224e84865d2954a2a914d46b64aa8219ddb565c44869  SoundFonts/Roland_SC-55.sf2" \
            | shasum -a 256 -c -

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          MPXADRV_TEST_SOUNDFONT: ${{ github.workspace }}/SoundFonts/Roland_SC-55.sf2
