name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-binary:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install dependencies
        run: brew install cmake mdxmini fluid-synth

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Stage package
        run: |
          version="${GITHUB_REF_NAME#v}"
          arch="$(uname -m)"
          stage="mpxadrv-${version}-macos-${arch}"
          mkdir -p "${stage}/bin" "${stage}/share/doc/mpxadrv"
          cmake --install build --prefix "${PWD}/${stage}"
          cp README.md "${stage}/share/doc/mpxadrv/"
          cp packaging/INSTALL.txt "${stage}/INSTALL.txt"
          tar -czf "${stage}.tar.gz" "${stage}"
          shasum -a 256 "${stage}.tar.gz" | tee "${stage}.tar.gz.sha256"
          echo "ASSET=${stage}.tar.gz" >> "$GITHUB_ENV"
          echo "ASSET_SUM=${stage}.tar.gz.sha256" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "mpxadrv ${GITHUB_REF_NAME}" \
            --notes-file packaging/RELEASE_NOTES.md \
            "$ASSET" \
            "$ASSET_SUM"
