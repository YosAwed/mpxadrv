name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-binary:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install dependencies
        run: brew install cmake mdxmini fluid-synth

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Stage package
        run: |
          version="${GITHUB_REF_NAME#v}"
          arch="$(uname -m)"
          stage="mpxadrv-${version}-macos-${arch}"
          mkdir -p "${stage}/bin" "${stage}/share/doc/mpxadrv"
          cmake --install build --prefix "${PWD}/${stage}"
          cp README.md "${stage}/share/doc/mpxadrv/"
          cat > "${stage}/INSTALL.txt" <<'EOF'
mpxadrv macOS binary package
============================

This binary is dynamically linked against Homebrew's mdxmini and
FluidSynth. Install those first:

  brew install mdxmini fluid-synth

Then put bin/mpxadrv and bin/mpxadrv-player on your PATH, or run
them by absolute path.

Prefer a source install when possible:

  brew install --HEAD --formula \
    https://raw.githubusercontent.com/YosAwed/mpxadrv/main/Formula/mpxadrv.rb

SoundFonts are not included; see README.md for an optional SC-55 bank.
EOF
          tar -czf "${stage}.tar.gz" "${stage}"
          shasum -a 256 "${stage}.tar.gz" | tee "${stage}.tar.gz.sha256"
          echo "ASSET=${stage}.tar.gz" >> "$GITHUB_ENV"
          echo "ASSET_SUM=${stage}.tar.gz.sha256" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(cat <<EOF
          ## mpxadrv ${GITHUB_REF_NAME}

          macOS binary (Apple Silicon runner) linked against Homebrew
          \`mdxmini\` and \`fluid-synth\`. Install those with Homebrew before
          running the binary, or prefer the formula:

          \`\`\`sh
          brew install --HEAD --formula \\
            https://raw.githubusercontent.com/YosAwed/mpxadrv/main/Formula/mpxadrv.rb
          \`\`\`

          See \`INSTALL.txt\` inside the archive and the repository README.
          EOF
          )"
          gh release create "$GITHUB_REF_NAME" \
            --title "mpxadrv ${GITHUB_REF_NAME}" \
            --notes "$notes" \
            "$ASSET" \
            "$ASSET_SUM"
